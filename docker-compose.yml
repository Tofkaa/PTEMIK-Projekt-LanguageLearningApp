version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: language_app_db
    restart: always
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: language_learning_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    image: languageapp-backend
    container_name: languageapp-backend
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/language_learning_db
      - SPRING_DATASOURCE_USERNAME=app_user
      - SPRING_DATASOURCE_PASSWORD=app_password
    ports:
      - "8080:8080"
    restart: always

  frontend:
    build: ./frontend
    image: languageapp-frontend
    container_name: languageapp-frontend
    depends_on:
      - backend
    ports:
      - "80:80"     # HTTP -> HTTPS átirányításhoz
      - "443:443"   # A tényleges HTTPS forgalomhoz
    restart: always

volumes:
  postgres_data: