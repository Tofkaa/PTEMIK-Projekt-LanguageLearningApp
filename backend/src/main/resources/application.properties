# Database Config
spring.application.name=backend
server.port=8080
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/language_learning_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Required deployment secret; test-only keys live in src/test/resources.
jwt.secret=${JWT_SECRET:}
jwt.expiration=900000
jwt.refresh.expiration=604800000

# Static salt for client side exercise checking
app.security.exercise-salt=L4ngu4ge4ppS3cr3tS4lt2026!

# Force Jackson parser to use UTC
spring.jackson.time-zone=UTC

# SMTP Configuration
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Image storage cloud provider
# Cloudinary
cloudinary.url=${CLOUDINARY_URL}

# Canonical public frontend URL: email/OAuth redirects, exact CORS origin and cookie API CSRF checks.
# Use https://localhost for the Compose HTTPS frontend; http://localhost:5173 for Vite.
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.oauth.authorization-base-url=${OAUTH_AUTHORIZATION_BASE_URL:http://localhost:8080}

# ==========================================
# OAUTH2 CONFIGURATION
# ==========================================

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# Discord OAuth2
spring.security.oauth2.client.registration.discord.client-id=${DISCORD_CLIENT_ID}
spring.security.oauth2.client.registration.discord.client-secret=${DISCORD_CLIENT_SECRET}
spring.security.oauth2.client.registration.discord.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.scope=identify,email
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/api/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
spring.security.oauth2.client.provider.discord.user-name-attribute=id

# Expired credentials: at most 100 candidates/table, 24-hour expired retention, short isolated transactions.
app.security.token-cleanup.enabled=true
app.security.token-cleanup.interval-ms=300000
app.security.token-cleanup.initial-delay-ms=300000

# Only this immediate reverse proxy can provide the overwritten client-IP header.
app.rate-limit.trusted-proxy-host=${APP_RATE_LIMIT_TRUSTED_PROXY_HOST:}

# Operational diagnostics: no payload/parameter/SMTP wire logging, including when application DEBUG is used.
logging.structured.format.console=logstash
logging.structured.json.exclude=stack_trace
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
spring.mvc.log-request-details=false
spring.mail.properties.mail.debug=false
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

spring.main.banner-mode=off

# Bound SMTP delivery and health probes too; protocol logging remains disabled.
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
logging.level.org.apache.http.wire=OFF
logging.level.org.apache.http.headers=OFF
server.tomcat.accesslog.enabled=false
