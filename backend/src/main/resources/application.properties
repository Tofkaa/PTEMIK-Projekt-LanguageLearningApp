# Database Config
spring.application.name=backend
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/language_learning_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:app_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Config - test environment
jwt.secret=8435678936969764532759744326978435678936969764532759744326978435
jwt.expiration=900000
jwt.refresh.expiration=604800000

# Static salt for client side exercise checking
app.security.exercise-salt=L4ngu4ge4ppS3cr3tS4lt2026!

# Force Jackson parser to use UTC
spring.jackson.time-zone=UTC

# SMTP Configuration
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Image storage cloud provider
# Cloudinary
cloudinary.url=${CLOUDINARY_URL}

# Frontend URL
app.frontend.url=${FRONTEND_URL:http://localhost:5173}