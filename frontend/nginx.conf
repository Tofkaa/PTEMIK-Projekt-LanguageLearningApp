# Access logs intentionally exclude query strings, Referer, cookies and authorization headers.
log_format app_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /var/log/nginx/access.log app_safe;

# 1. HTTP -> HTTPS Átirányítás
server {
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/access.log app_safe;
    return 301 https://$host$request_uri;
}

# 2. HTTPS Szerver
server {
    listen 443 ssl;
    server_name localhost;
    access_log /var/log/nginx/access.log app_safe;
    add_header Referrer-Policy "no-referrer" always;

    # SSL Tanúsítványok helye (a Docker konténeren belül)
    ssl_certificate /etc/nginx/ssl/cert.crt;
    ssl_certificate_key /etc/nginx/ssl/cert.key;

    # React Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reject stale JWT-query callbacks before loading assets or proxying requests.
    location = /oauth2/redirect {
        if ($arg_token != "") { return 302 /login?oauth_error=identity_unavailable; }
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Spring Boot API Proxy (Belső hálózaton már HTTP-vel kommunikál a backenddel)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-App-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # Jelzi a backendnek, hogy kívülről HTTPS jött
    }

    # Server-Sent Events Proxy
    location /api/notifications/stream {
        if ($arg_token != "") { return 401; }
        proxy_pass http://backend:8080/api/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}