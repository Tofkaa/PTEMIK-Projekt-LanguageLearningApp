# Keep error severity/errno/context while redacting request values before writing to Docker stderr.
map $upstream_http_x_request_id $app_request_id {
    default $upstream_http_x_request_id;
    "" $request_id;
}
log_format app_safe escape=json '{"time":"$time_iso8601","requestId":"$app_request_id","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
access_log /var/log/nginx/access.log app_safe;
error_log /var/log/nginx/diagnostic.pipe warn;

# 1. HTTP -> HTTPS Átirányítás
server {
    listen 80;
    server_name localhost;
    access_log /var/log/nginx/access.log app_safe;
    return 301 https://$host$request_uri;
}

# 2. HTTPS Szerver
server {
    listen 443 ssl;
    server_name localhost;
    access_log /var/log/nginx/access.log app_safe;
    add_header Referrer-Policy "no-referrer" always;
    proxy_hide_header X-Request-ID;
    add_header X-Request-ID $app_request_id always;

    # SSL Tanúsítványok helye (a Docker konténeren belül)
    ssl_certificate /etc/nginx/ssl/cert.crt;
    ssl_certificate_key /etc/nginx/ssl/cert.key;

    # Match the API upload envelope; edge rejections use the same diagnostic fields as backend errors.
    client_max_body_size 6m;
    error_page 413 = @diagnostic_413;
    location @diagnostic_413 {
        default_type application/json;
        return 413 '{"timestamp":"$time_iso8601","status":413,"error":"Payload Too Large","message":"A feltöltött kérés túl nagy.","path":null,"requestId":"$app_request_id"}';
    }
    error_page 500 = @diagnostic_500;
    location @diagnostic_500 {
        default_type application/json;
        return 500 '{"timestamp":"$time_iso8601","status":500,"error":"Internal Server Error","message":"A kiszolgáló nem tudta befejezni a kérést.","path":null,"requestId":"$app_request_id"}';
    }
    error_page 502 = @diagnostic_502;
    location @diagnostic_502 {
        default_type application/json;
        return 502 '{"timestamp":"$time_iso8601","status":502,"error":"Bad Gateway","message":"A háttérkiszolgáló most nem érhető el.","path":null,"requestId":"$app_request_id"}';
    }
    error_page 503 = @diagnostic_503;
    location @diagnostic_503 {
        default_type application/json;
        return 503 '{"timestamp":"$time_iso8601","status":503,"error":"Service Unavailable","message":"A szolgáltatás most nem érhető el.","path":null,"requestId":"$app_request_id"}';
    }
    error_page 504 = @diagnostic_504;
    location @diagnostic_504 {
        default_type application/json;
        return 504 '{"timestamp":"$time_iso8601","status":504,"error":"Gateway Timeout","message":"A háttérkiszolgáló válasza nem érkezett meg időben.","path":null,"requestId":"$app_request_id"}';
    }

    # React Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reject stale JWT-query callbacks before loading assets or proxying requests.
    location = /oauth2/redirect {
        if ($arg_token != "") { return 302 /login?oauth_error=identity_unavailable; }
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Spring Boot API Proxy (Belső hálózaton már HTTP-vel kommunikál a backenddel)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-App-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # Jelzi a backendnek, hogy kívülről HTTPS jött
    }

    # Backend requires a current verified administrator for this minimal surface.
    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-App-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Server-Sent Events Proxy
    location /api/notifications/stream {
        if ($arg_token != "") { return 401; }
        proxy_pass http://backend:8080/api/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}