# 1. HTTP -> HTTPS Átirányítás
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# 2. HTTPS Szerver
server {
    listen 443 ssl;
    server_name localhost;

    # SSL Tanúsítványok helye (a Docker konténeren belül)
    ssl_certificate /etc/nginx/ssl/cert.crt;
    ssl_certificate_key /etc/nginx/ssl/cert.key;

    # React Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Spring Boot API Proxy (Belső hálózaton már HTTP-vel kommunikál a backenddel)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # Jelzi a backendnek, hogy kívülről HTTPS jött
    }

    # Server-Sent Events Proxy
    location /api/notifications/stream {
        proxy_pass http://backend:8080/api/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
}